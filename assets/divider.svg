<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 6" width="1000" height="6" role="img" aria-label="Separator">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="2.5" width="1000" height="1" fill="#30363d"/>

  <rect y="2" width="200" height="2" fill="url(#sweep)">
    <animate attributeName="x" values="-200;1000" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
