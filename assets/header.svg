<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="hdrTitle hdrDesc">
  <title id="hdrTitle">Nikodem Jachec — AI Automation Engineer</title>
  <desc id="hdrDesc">Okno terminala z animowanym wpisywaniem komend</desc>

  <defs>
    <clipPath id="typeA"><rect x="30" y="70" width="0" height="26">
      <animate attributeName="width" values="0;0;82;82" keyTimes="0;0.02;0.0733;1" dur="15s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="typeB"><rect x="30" y="136" width="0" height="26">
      <animate attributeName="width" values="0;0;153;153" keyTimes="0;0.1333;0.22;1" dur="15s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <!-- ===== okno ===== -->
  <rect x="1" y="1" width="998" height="288" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- pasek tytulu -->
  <path d="M1,13 a12,12 0 0 1 12,-12 h974 a12,12 0 0 1 12,12 v28 h-998 z" fill="#161b22"/>
  <line x1="1" y1="41" x2="999" y2="41" stroke="#30363d" stroke-width="1.5"/>

  <g opacity="0.85">
    <circle cx="30" cy="21" r="5.5" fill="#f0625b"/>
    <circle cx="50" cy="21" r="5.5" fill="#f5be4f"/>
    <circle cx="70" cy="21" r="5.5" fill="#4fc76a"/>
  </g>

  <text x="500" y="26" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="13" fill="#8b949e">nikodem@automee: ~/ai-automation</text>

  <!-- ===== tresc ===== -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="17">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9333;0.98;1" dur="15s" repeatCount="indefinite"/>

    <!-- $ whoami -->
    <text x="30" y="88" clip-path="url(#typeA)"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9">&#160;whoami</tspan></text>

    <!-- output -->
    <text x="30" y="121" fill="#58a6ff" opacity="0">AI Automation Engineer · voice agents · LLM pipelines
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0867;0.1067;1" dur="15s" repeatCount="indefinite"/>
    </text>

    <!-- $ cat stack.txt -->
    <text x="30" y="154" clip-path="url(#typeB)"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9">&#160;cat stack.txt</tspan></text>

    <!-- output -->
    <text x="30" y="187" fill="#8b949e" opacity="0">openai · gemini · elevenlabs · deepgram · twilio
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2333;0.2533;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="220" fill="#8b949e" opacity="0">n8n · fastapi · nestjs · postgres · docker · k8s
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2733;0.2933;1" dur="15s" repeatCount="indefinite"/>
    </text>

    <!-- prompt koncowy -->
    <text x="30" y="253" fill="#3fb950" opacity="0">$
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3133;0.32;1" dur="15s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ===== kursory ===== -->
  <g fill="#58a6ff">
    <!-- kursor jadacy za pisanym tekstem: linia 1 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.02;0.0733;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/>
      <rect x="30" y="74" width="9" height="19">
        <animate attributeName="x" values="30;30;112;112" keyTimes="0;0.02;0.0733;1" dur="15s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- kursor jadacy za pisanym tekstem: linia 3 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1333;0.22;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/>
      <rect x="30" y="140" width="9" height="19">
        <animate attributeName="x" values="30;30;183;183" keyTimes="0;0.1333;0.22;1" dur="15s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- kursor mrugajacy w promptcie koncowym -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.3133;0.9333;0.98" calcMode="discrete" dur="15s" repeatCount="indefinite"/>
      <rect x="50" y="239" width="9" height="19">
        <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
