  <text x="28" y="252" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="14" xml:space="preserve" opacity="0"><tspan fill="#6e7681">  </tspan><tspan fill="#79c0ff">"embedded"</tspan><tspan fill="#6e7681">:   </tspan><tspan fill="#e6edf3">[</tspan><tspan fill="#a5d6ff">"nRF52840 Sense"</tspan><tspan fill="#6e7681">, </tspan><tspan fill="#a5d6ff">"ADS1292"</tspan><tspan fill="#6e7681">, </tspan><tspan fill="#a5d6ff">"BQ25185"</tspan><tspan fill="#e6edf3">]</tspan><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.74s" fill="freeze"/></text>
